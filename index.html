<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light}html,body{margin:0;height:100%}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Free in Brooklyn</title>
<style>
/* Layout concept: Apple-style chrome. A slim translucent nav bar over a full-bleed map,
   with a floating frosted sidebar for search, filters and program details (stacked below the map on phones).
   Type is Apple's system font (SF Pro on Apple devices, system UI elsewhere). */
:root {
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", system-ui, "Segoe UI", Roboto, sans-serif;
  --bg: #f5f5f7;
  --panel: rgba(255, 255, 255, .80);
  --solid: #ffffff;
  --fill: rgba(120, 120, 128, .12);
  --fill-2: rgba(120, 120, 128, .20);
  --label: #1d1d1f;
  --label-2: #5c5c61;
  --sep: rgba(60, 60, 67, .16);
  --accent: #0071e3;
  --on-accent: #ffffff;
  --star: #ff9f0a;
  --nav: rgba(22, 22, 23, .82);
  --on-nav: #f5f5f7;
  --shadow: 0 0 0 .5px rgba(0, 0, 0, .08), 0 8px 28px rgba(0, 0, 0, .16);
  --on-cat: #ffffff;
  --c-gallery: #5856d6; --c-talk: #0a7ea4; --c-workshop: #c2410c; --c-show: #c2255c; --c-festival: #248a3d; --c-tour: #8a5a00; --c-space: #0f766e; --c-club: #9a3d8f; --c-lib: #b0413e; --c-multi: #3a3a3c;

  --m-water: #a6d4ea; --m-land: #f6f6f4; --m-other: #e9ebee; --m-park: #cbe7c3; --m-road: #ffffff; --m-road-edge: #dfe2e6;
  --m-hwy: #a5aed3; --m-bound: #e07a7a; --m-text: #3c3f44; --m-text-2: #6f757c; --m-water-text: #4d86a3; --m-park-text: #3f8a52;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #000000; --panel: rgba(36, 36, 38, .80); --solid: #1c1c1e; --fill: rgba(120, 120, 128, .24); --fill-2: rgba(120, 120, 128, .36);
    --label: #f5f5f7; --label-2: #a1a1a6; --sep: rgba(84, 84, 88, .55); --accent: #2997ff; --on-accent: #001a33; --star: #ffb340;
    --nav: rgba(28, 28, 30, .82); --shadow: 0 0 0 .5px rgba(255, 255, 255, .10), 0 8px 28px rgba(0, 0, 0, .55);
    --on-cat: #0b0b0c;
    --c-gallery: #9a99ff; --c-talk: #4cc3e6; --c-workshop: #ff9f5a; --c-show: #ff6a96; --c-festival: #4ed36e; --c-tour: #e6b34a; --c-space: #3fd0b8; --c-club: #e08ad6; --c-lib: #ff8f86; --c-multi: #d1d1d6;
    --m-water: #123149; --m-land: #1f2226; --m-other: #17191c; --m-park: #1f3b2b; --m-road: #30343a; --m-road-edge: #24272c;
    --m-hwy: #4b5486; --m-bound: #a65a5a; --m-text: #c9ccd1; --m-text-2: #8d939b; --m-water-text: #6fa3c0; --m-park-text: #6fbf86;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #000000; --panel: rgba(36, 36, 38, .80); --solid: #1c1c1e; --fill: rgba(120, 120, 128, .24); --fill-2: rgba(120, 120, 128, .36);
  --label: #f5f5f7; --label-2: #a1a1a6; --sep: rgba(84, 84, 88, .55); --accent: #2997ff; --on-accent: #001a33; --star: #ffb340;
  --nav: rgba(28, 28, 30, .82); --shadow: 0 0 0 .5px rgba(255, 255, 255, .10), 0 8px 28px rgba(0, 0, 0, .55);
  --on-cat: #0b0b0c;
  --c-gallery: #9a99ff; --c-talk: #4cc3e6; --c-workshop: #ff9f5a; --c-show: #ff6a96; --c-festival: #4ed36e; --c-tour: #e6b34a; --c-space: #3fd0b8; --c-club: #e08ad6; --c-lib: #ff8f86; --c-multi: #d1d1d6;
  --m-water: #123149; --m-land: #1f2226; --m-other: #17191c; --m-park: #1f3b2b; --m-road: #30343a; --m-road-edge: #24272c;
  --m-hwy: #4b5486; --m-bound: #a65a5a; --m-text: #c9ccd1; --m-text-2: #8d939b; --m-water-text: #6fa3c0; --m-park-text: #6fbf86;
  color-scheme: dark;
}
@media (prefers-reduced-transparency: reduce) { :root { --panel: var(--solid); --nav: #161617; } }

* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--label); font-family: var(--font); font-size: 15px; line-height: 1.4; letter-spacing: -0.005em; overflow: hidden; -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums; }
button, input { font: inherit; color: inherit; letter-spacing: inherit; }
button { cursor: pointer; }
a { color: var(--accent); }
h1, h2, h3, p { margin: 0; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.skip { position: absolute; left: 12px; top: -60px; z-index: 100; background: var(--solid); color: var(--label); padding: 10px 16px; border-radius: 10px; box-shadow: var(--shadow); text-decoration: none; font-weight: 600; }
.skip:focus { top: 12px; }

.app { height: 100%; display: flex; flex-direction: column; min-height: 0; }

/* Nav bar */
.nav { background: var(--nav); color: var(--on-nav); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px); height: 48px; flex: none; display: flex; align-items: center; gap: 28px; padding: 0 20px; position: relative; z-index: 30; }
.brand { color: var(--on-nav); text-decoration: none; font-size: 19px; font-weight: 600; letter-spacing: -0.02em; white-space: nowrap; }
.links { display: flex; gap: 4px; flex: 1; min-width: 0; }
.links button { background: none; border: 0; color: var(--on-nav); opacity: .82; font-size: 13px; padding: 12px 10px; border-radius: 8px; min-height: 44px; }
.links button:hover { opacity: 1; }
.links button[aria-current="page"] { opacity: 1; font-weight: 600; }
.proto { font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; border: 1px solid rgba(255, 255, 255, .35); border-radius: 999px; padding: 2px 8px; opacity: .85; white-space: nowrap; }
.tools { display: flex; align-items: center; gap: 6px; margin-left: auto; }
.nbtn { background: none; border: 0; color: var(--on-nav); border-radius: 999px; min-width: 44px; min-height: 44px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 0 10px; font-size: 13px; font-weight: 500; }
.nbtn:hover, .nbtn[aria-pressed="true"], .nbtn[aria-expanded="true"] { background: rgba(255, 255, 255, .16); }
.nbtn .n { font-size: 12px; font-weight: 600; background: var(--star); color: #1a1100; border-radius: 999px; min-width: 20px; height: 20px; padding: 0 6px; display: inline-grid; place-items: center; }
.nbtn:focus-visible { outline-color: #fff; }
.pop { position: absolute; right: 16px; top: calc(100% + 8px); width: min(320px, calc(100vw - 32px)); background: var(--solid); border-radius: 16px; box-shadow: var(--shadow); padding: 8px; color: var(--label); }
.pop .who { display: flex; gap: 12px; align-items: center; padding: 12px; }
.pop .big { width: 48px; height: 48px; border-radius: 50%; background: var(--fill-2); display: grid; place-items: center; color: var(--label-2); }
.pop h2 { font-size: 17px; font-weight: 600; }
.pop p { color: var(--label-2); font-size: 13px; }
.pop .group { background: var(--fill); border-radius: 12px; margin: 4px; }
.pop .row { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 14px; font-size: 15px; min-height: 44px; width: 100%; border: 0; background: none; text-align: left; }
.pop .row + .row { border-top: 1px solid var(--sep); }
.pop button.row { color: var(--accent); }
.pop .row b { font-weight: 600; }

/* Workspace */
.main { flex: 1; min-height: 0; position: relative; }
.mapwrap { position: absolute; inset: 0; overflow: hidden; background: var(--m-water); }
#map { width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; user-select: none; -webkit-user-select: none; }
#map.dragging { cursor: grabbing; }
#map:focus-visible { outline-offset: -3px; }

.panel { position: absolute; z-index: 10; left: 12px; top: 12px; bottom: 12px; width: 392px; background: var(--panel); -webkit-backdrop-filter: saturate(180%) blur(30px); backdrop-filter: saturate(180%) blur(30px); border-radius: 18px; box-shadow: var(--shadow); display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
.panel-top { padding: 18px 16px 12px; display: flex; flex-direction: column; gap: 12px; }
.panel-top h1 { font-size: 28px; line-height: 1.12; font-weight: 700; letter-spacing: -0.025em; text-wrap: balance; }
.panel-top .sub { color: var(--label-2); font-size: 14px; margin-top: 2px; }
.search { position: relative; }
.search input { width: 100%; background: var(--fill); border: 0; border-radius: 12px; padding: 0 12px 0 38px; height: 44px; font-size: 16px; }
.search input::placeholder { color: var(--label-2); }
.search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--label-2); pointer-events: none; }
.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin: 0 -16px; padding: 2px 16px; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; display: inline-flex; align-items: center; gap: 7px; min-height: 36px; padding: 0 14px 0 8px; border: 0; border-radius: 999px; background: var(--fill); font-size: 14px; font-weight: 500; white-space: nowrap; }
.chip.all { padding-left: 14px; }
.chip .ic { width: 22px; height: 22px; border-radius: 50%; background: var(--cat); color: var(--on-cat); display: grid; place-items: center; }
.chip[aria-pressed="true"] { background: var(--label); color: var(--bg); }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--fill); border-radius: 10px; padding: 2px; gap: 2px; }
.seg button { border: 0; background: none; border-radius: 8px; min-height: 40px; font-size: 14px; font-weight: 500; }
.seg button[aria-pressed="true"] { background: var(--solid); box-shadow: 0 1px 3px rgba(0, 0, 0, .18); font-weight: 600; }
.panel-body { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 4px 12px 16px; }
.group { background: var(--solid); border-radius: 14px; overflow: hidden; }
.zip { position: relative; display: flex; gap: 8px; }
.zip .zin { position: relative; flex: 1; min-width: 0; }
.zip .zin svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--accent); pointer-events: none; }
.zip input { width: 100%; background: var(--fill); border: 0; border-radius: 12px; padding: 0 12px 0 38px; height: 44px; font-size: 16px; font-variant-numeric: tabular-nums; }
.zip input::placeholder { color: var(--label-2); }
.zip button { height: 44px; padding: 0 16px; border: 0; border-radius: 12px; background: var(--accent); color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; }
.zipmsg { margin: 6px 4px 0; font-size: 13px; color: var(--label-2); }
.focusbar { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 14px; margin-bottom: 8px; background: var(--fill); border-radius: 12px; font-size: 14px; }
.linkbtn { background: none; border: 0; padding: 0; min-height: 44px; color: var(--accent); font-weight: 500; }

.item { display: grid; grid-template-columns: 40px minmax(0, 1fr) 44px; gap: 12px; padding: 12px 6px 12px 14px; align-items: start; cursor: pointer; position: relative; }
.item + .item::before { content: ""; position: absolute; top: 0; left: 66px; right: 0; height: 1px; background: var(--sep); }
.item:hover, .item.sel { background: var(--fill); }
.ic-sq { width: 40px; height: 40px; border-radius: 10px; background: var(--cat); color: var(--on-cat); display: grid; place-items: center; }
.item h3 { font-size: 16px; line-height: 1.25; font-weight: 600; letter-spacing: -0.01em; text-wrap: balance; }
.item .org { color: var(--label-2); font-size: 14px; margin-top: 1px; }
.item .when { font-size: 14px; margin-top: 6px; }
.pill { display: inline-block; font-size: 12px; font-weight: 600; padding: 1px 8px; border-radius: 999px; background: var(--fill-2); margin-right: 6px; }
.pill.today { background: var(--accent); color: var(--on-accent); }
.starbtn { border: 0; background: none; min-width: 44px; min-height: 44px; margin-top: -6px; border-radius: 50%; color: var(--label-2); display: grid; place-items: center; }
.starbtn:hover { background: var(--fill-2); }
.starbtn[aria-pressed="true"] { color: var(--star); }
.empty { padding: 36px 24px; color: var(--label-2); text-align: center; display: flex; flex-direction: column; gap: 10px; align-items: center; }
.empty b { color: var(--label); font-size: 19px; font-weight: 600; }

.detail { display: flex; flex-direction: column; gap: 16px; padding: 4px 4px 8px; }
.back { align-self: flex-start; background: none; border: 0; min-height: 44px; padding: 0 8px 0 0; display: inline-flex; align-items: center; gap: 2px; color: var(--accent); font-size: 16px; font-weight: 500; }
.detail h2 { font-size: 28px; line-height: 1.12; font-weight: 700; letter-spacing: -0.025em; text-wrap: balance; }
.detail .org { color: var(--label-2); font-size: 16px; margin-top: 4px; }
.badges { display: flex; flex-wrap: wrap; gap: 8px; }
.badge { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; padding: 4px 10px 4px 6px; border-radius: 999px; background: var(--fill); }
.badge .ic { width: 20px; height: 20px; border-radius: 50%; background: var(--cat); color: var(--on-cat); display: grid; place-items: center; }
.badge.plain { padding-left: 10px; }
.badge.free { background: var(--c-festival); color: var(--on-cat); }
.badge.cond { background: none; border: 1.5px solid var(--c-festival); color: var(--label); }
.catch { margin: 0; padding: 10px 12px; border-radius: 12px; background: var(--fill); font-size: 14px; display: grid; gap: 2px; }
.catch b { font-size: 13px; }
.pill.cond { background: none; box-shadow: inset 0 0 0 1px var(--label-2); font-weight: 500; }
.badge.today { background: var(--accent); color: var(--on-accent); }
.badge.warn { background: none; border: 1px dashed var(--label-2); font-weight: 500; }
.blurb { font-size: 16px; line-height: 1.45; max-width: 65ch; }
.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.btn { border: 0; background: var(--fill); border-radius: 12px; min-height: 48px; padding: 0 16px; font-size: 16px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; color: var(--accent); }
.btn:hover { background: var(--fill-2); }
.btn.primary { background: var(--accent); color: var(--on-accent); }
.btn.primary:hover { filter: brightness(1.08); background: var(--accent); }
.btn.starred { background: var(--star); color: #1a1100; }
.facts { background: var(--solid); border-radius: 14px; margin: 0; }
.facts div { padding: 12px 14px; position: relative; }
.facts div + div::before { content: ""; position: absolute; top: 0; left: 14px; right: 0; height: 1px; background: var(--sep); }
.facts dt { font-size: 13px; color: var(--label-2); font-weight: 500; }
.facts dd { margin: 2px 0 0; font-size: 16px; overflow-wrap: anywhere; }
.facts dd small { display: block; color: var(--label-2); font-size: 14px; margin-top: 2px; }
.about { display: flex; flex-direction: column; gap: 8px; background: var(--solid); border-radius: 14px; padding: 14px; }
.about h3 { margin: 0; font-size: 20px; font-weight: 700; letter-spacing: -.01em; }
.about h4 { margin: 8px 0 0; font-size: 13px; font-weight: 600; color: var(--label-2); text-transform: uppercase; letter-spacing: .05em; }
.about p { margin: 0; font-size: 16px; line-height: 1.45; max-width: 65ch; }
.about ul { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; font-size: 16px; line-height: 1.4; }
.note { font-size: 13px; color: var(--label-2); padding: 0 4px; }
.checked { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--label-2); margin: 0; }
.checked svg { flex: none; }
.checked.no { color: var(--label); }

/* Map drawing */
.m-water { fill: var(--m-water); }
.m-other { fill: var(--m-other); }
.m-land { fill: var(--m-land); }
.m-park { fill: var(--m-park); }
.m-bound { fill: none; stroke: var(--m-bound); stroke-width: 1.6; stroke-dasharray: 1.2 2.4; vector-effect: non-scaling-stroke; stroke-linecap: round; }
.m-road { fill: none; stroke: var(--m-road); stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
.m-roadedge { fill: none; stroke: var(--m-road-edge); stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
.m-hwy { fill: none; stroke: var(--m-hwy); stroke-width: 3.6; stroke-linecap: round; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
.t { text-anchor: middle; pointer-events: none; paint-order: stroke; stroke-linejoin: round; font-family: var(--font); }
.t-n { font-size: 11px; font-weight: 600; letter-spacing: .09em; text-transform: uppercase; fill: var(--m-text); stroke: var(--m-land); stroke-width: 3px; }
.t-q { font-size: 11px; font-weight: 600; letter-spacing: .09em; text-transform: uppercase; fill: var(--m-text-2); stroke: var(--m-other); stroke-width: 3px; }
.t-b { font-size: 18px; font-weight: 700; letter-spacing: .12em; fill: var(--m-text); stroke: var(--m-land); stroke-width: 4px; }
.t-c { font-size: 26px; font-weight: 700; letter-spacing: -.01em; fill: var(--m-text); stroke: var(--m-other); stroke-width: 4px; }
.t-w { font-size: 12px; font-style: italic; letter-spacing: .14em; fill: var(--m-water-text); stroke: none; }
.t-p { font-size: 12px; font-weight: 500; fill: var(--m-park-text); stroke: var(--m-land); stroke-width: 3px; }

.cluster { cursor: pointer; }
.clbody { fill: var(--accent); stroke: var(--solid); stroke-width: 3; }
.clnum { font-family: var(--font); font-weight: 700; font-size: 15px; fill: var(--on-accent); text-anchor: middle; dominant-baseline: central; pointer-events: none; }
.cluster:hover .clbody { stroke: var(--label); }
.cluster:focus-visible { outline: none; }
.cluster:focus-visible .clbody { stroke: var(--label); stroke-width: 4; }
.pin { cursor: pointer; }
.pinbody { fill: var(--cat, var(--c-multi)); stroke: var(--solid); stroke-width: 2.2; }
.pin:hover .pinbody, .pin.sel .pinbody { stroke: var(--label); }
.pin:focus-visible { outline: none; }
.pin:focus-visible .pinbody { stroke: var(--accent); stroke-width: 4; }
.pinnum { font-family: var(--font); font-weight: 700; font-size: 14px; fill: var(--on-cat); text-anchor: middle; pointer-events: none; }
.pinstar { fill: var(--star); stroke: var(--solid); stroke-width: 1.6; }
.pinlabel { font-family: var(--font); font-size: 13px; font-weight: 600; fill: var(--label); paint-order: stroke; stroke: var(--solid); stroke-width: 4px; stroke-linejoin: round; opacity: 0; pointer-events: none; }
.pin:hover .pinlabel, .pin.sel .pinlabel, .pin:focus-visible .pinlabel, #map.show-labels .pinlabel { opacity: 1; }
.pin.sel { filter: drop-shadow(0 4px 6px rgba(0, 0, 0, .35)); }

.mapctl { position: absolute; right: 14px; top: 14px; display: flex; flex-direction: column; background: var(--panel); -webkit-backdrop-filter: saturate(180%) blur(30px); backdrop-filter: saturate(180%) blur(30px); border-radius: 12px; box-shadow: var(--shadow); overflow: hidden; z-index: 5; }
.mapctl button { width: 44px; height: 44px; border: 0; background: none; display: grid; place-items: center; color: var(--label); }
.mapctl button + button { border-top: 1px solid var(--sep); }
.mapctl button:hover { background: var(--fill); }
.attrib { position: absolute; right: 12px; bottom: 10px; font-size: 12px; color: var(--label-2); background: var(--panel); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); padding: 3px 10px; border-radius: 999px; z-index: 5; max-width: calc(100% - 24px); }

.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: rgba(40, 40, 42, .92); color: #f5f5f7; -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); padding: 12px 18px; border-radius: 14px; font-size: 15px; box-shadow: var(--shadow); z-index: 60; max-width: calc(100vw - 32px); }

@media (max-width: 860px) {
  .links, .proto { display: none; }
  .nav { padding: 0 8px 0 16px; gap: 8px; }
  .nbtn .lbl { display: none; }
  .mapwrap { bottom: 50%; }
  .panel { left: 0; right: 0; top: 50%; bottom: 0; width: auto; border-radius: 18px 18px 0 0; }
  .panel::before { content: ""; display: block; width: 36px; height: 5px; border-radius: 3px; background: var(--fill-2); margin: 6px auto -8px; flex: none; }
  .panel-top { padding: 14px 16px 8px; gap: 10px; }
  .panel-top h1 { font-size: 22px; }
  .attrib { bottom: calc(50% + 8px); }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; transition: none !important; } }
</style>

<a class="skip" href="#panelBody">Skip to program list</a>
<div class="app">
  <header class="nav">
    <a class="brand" href="#" id="brandLink">Free in Brooklyn</a>
    <span class="proto">Prototype</span>
    <nav class="links" aria-label="Main">
      <button type="button" aria-current="page" data-nav="map">Map</button>
      <button type="button" data-nav="soon">Calendar</button>
      <button type="button" data-nav="soon">Venues</button>
      <button type="button" data-nav="soon">Submit a program</button>
    </nav>

  /* About sections. Sources: Brooklyn Eagle, "Free programming in Brooklyn" (Oct 2026), plus the organizers' own pages. */
  var ABOUT = {
    "pioneer-second-sundays": {
      about: ["On the second Sunday of every month, Pioneer Works opens its whole Red Hook building to the public. The organization calls itself a third space, neither a school nor a museum, and this is where that shows: wander in with no ticket and no plan.",
              "It runs alongside the free exhibitions and open artists' studios that happen all year."],
      expect: ["Open studios, exhibitions, workshops and live music across the floors and the garden", "Past editions have included solar gazing with amateur astronomers, gallery dialogues and a radio hour", "Food and drink from local vendors and the Pioneer Works bar"],
      know: ["Open to all ages", "A free RSVP is listed on the program page", "Crowds build in the afternoon, so go early for the quieter hours"],
      org: "Pioneer Works was co-founded in Red Hook in 2012 by Janna Levin, Dustin Yellin and Gabriel Florenz. It aims to make a large share of its programming, and its day-to-day life, free to enter."
    },
    "pioneer-science": {
      about: ["Scientific Controversies, hosted by Janna Levin since 2014, puts two people on stage to talk through different sides of an unsolved problem. Levin says it is not a debate in any way. Topics have ranged from animal life to aliens, quantum physics and black holes.",
              "The first one, with physicists Max Tegmark and Frank Wilczek, got almost no promotion and still drew 350 to 450 people."],
      expect: ["Conversation rather than a lecture", "Often live music, local food and telescope viewings", "Guests from the top of their fields"],
      know: ["Most events fill to capacity, so arrive early and RSVP if one is offered", "Every science event is free because of support from the Simons Foundation", "No. 37 is titled Octopus Umwelt. The listing gives no start time"],
      org: "Levin is an astrophysicist, a Columbia professor and the founding director of Sciences at Pioneer Works."
    },
    "cbh-battle": {
      about: ["A free exhibition on Brooklyn's role in the Revolutionary War, shown as part of the borough-wide Brooklyn 250 program.",
              "The Center's Brooklyn Is... exhibition is also free and has curator-guided tours."],
      expect: ["Maps, objects and documents from the Center's collections", "Free tours on set dates during the run"],
      know: ["Admission to the Center, its exhibitions and its programs is free", "Check the events page for tour dates"],
      org: "The Center for Brooklyn History was the Brooklyn Historical Society until it merged with the Brooklyn Public Library about five years ago. After the merger it became completely free, ending low ticket prices and its membership program."
    },
    "cbh-talks": {
      about: ["Most programs here are not single-speaker lectures. They usually pair several speakers with a panel discussion and a long Q&A.",
              "Topics have included UFOs and aliens, disability justice, Puerto Rico's future and a three-part climate panel, alongside traditional book talks. For the 250th anniversary of the Declaration of Independence, three scholars each picked a founding-era text, then came down from the stage to talk with Brooklynites in town halls."],
      expect: ["Panels with time for audience questions", "Hands-on sessions such as the Zine-In workshop", "In-person and online options"],

      org: "Marcia Ely, the Center's first director of public programming, says: 'We can't exclude people based on their ability to afford a $20 ticket.'"

    "cbh-othmer": {
      about: ["The Othmer Library is the Center's archival research library. It became open to the public for reading and study when the Center went fully free.",
              "It is a good first stop for anyone curious about their own block, family or neighborhood."],
      expect: ["A reading room for study", "Archives on Brooklyn's history"],
      know: ["Hours and any appointment rules were not verified. Check the Center's site before you go", "Bring ID if the site asks for it"],
      org: "Part of the Center for Brooklyn History at 128 Pierrepont Street, Brooklyn Heights."
    },
    "bpl-presents": {
      about: ["BPL Presents is the library's signature arts and culture series, led by László Jakab Orsós, who joined in 2016 as the library's first vice president of arts and culture. It began with movies projected onto the Central Library facade and concerts in the plaza.",
              "Author talks bring in big names. The month the Eagle article ran, that meant Nikole Hannah-Jones and Colin Kaepernick."],
      expect: ["Author conversations and book prize readings", "Festival events and outdoor screenings and concerts at Central Library"],
      know: ["Event dates are posted on the BPL Presents page", "Orsós says the library tries to keep its spaces physically free: 'You don't have to act as a customer.'"],
      org: "Free has long been the default at the Brooklyn Public Library. The arts team set out to go past the expected, such as reading groups and tax clinics, which still run."
    },
    "bpl-night": {
      about: ["Night in the Library turns the Central Library into an all-night evening of philosophy and culture. The line to get in has looked more like a club night than a library event.",

    pinEls.forEach(function (p) {
      var s = p.sel ? 1.25 : 1;
      p.el.setAttribute("transform", "translate(" + (view.tx + p.x * view.k).toFixed(1) + " " + (view.ty + p.y * view.k).toFixed(1) + ") scale(" + s + ")");
    });
    svg.classList.toggle("show-labels", view.k > k0 * 2.6);
    regroup();
  }

  /* Zoom-based clustering: venues closer than CL_R screen pixels merge into one numbered bubble. Zoom in to split them, zoom out to merge them. */
  var CL_R = 42, clSig = null, clustersG = $("clusters"), clusterEls = [];
  function regroup() {
    var sorted = pinEls.slice().sort(function (a, b) {
      var pa = a.sel || a.key === state.venueFocus ? 1 : 0, pb = b.sel || b.key === state.venueFocus ? 1 : 0;
      return pb - pa || b.n - a.n || (a.key < b.key ? -1 : 1);
    });
    function pinned(it) { return it.sel || it.key === state.venueFocus; }

      if (used[it.key]) return;
      var g = [it]; used[it.key] = true;
      if (!pinned(it)) sorted.forEach(function (o) {
        if (used[o.key] || pinned(o)) return;
        if (Math.hypot((o.x - it.x) * view.k, (o.y - it.y) * view.k) < CL_R) { g.push(o); used[o.key] = true; }
      });
      groups.push(g);
    });
    var sig = groups.filter(function (g) { return g.length > 1; }).map(function (g) { return g.map(function (m) { return m.key; }).sort().join("+"); }).sort().join("|");
    if (sig !== clSig) {
      clSig = sig; var html = "";
      clusterEls = [];
      groups.forEach(function (g) {
        var multi = g.length > 1;
        g.forEach(function (m) { m.el.style.display = multi ? "none" : ""; });
        if (!multi) return;
        var cx = 0, cy = 0, total = 0;
        g.forEach(function (m) { cx += m.x; cy += m.y; total += m.n; });
        var names = g.map(function (m) { return VENUES[m.key].name; });
        html += '<g class="cluster" data-wx="' + (cx / g.length).toFixed(1) + '" data-wy="' + (cy / g.length).toFixed(1) + '" tabindex="0" role="button" aria-label="' +
          esc(total + (total === 1 ? " program" : " programs") + " at " + g.length + " places: " + names.slice(0, 3).join(", ") + (names.length > 3 ? " and more" : "") + ". Activate to zoom in") +
          '"><circle class="clbody" r="20"/><text class="clnum">' + total + "</text></g>";
      });
      clustersG.innerHTML = html;
      clusterEls = [].map.call(clustersG.children, function (el) { return { el: el, x: +el.getAttribute("data-wx"), y: +el.getAttribute("data-wy") }; });
    }
    clusterEls.forEach(function (c) { c.el.setAttribute("transform", "translate(" + (view.tx + c.x * view.k).toFixed(1) + " " + (view.ty + c.y * view.k).toFixed(1) + ")"); });
  }
  function onCluster(el) {
    var wx = +el.getAttribute("data-wx"), wy = +el.getAttribute("data-wy");
    flyTo(wx, wy, Math.min(k0 * 10, view.k * 2.3));
  }

  function measure() {
    var r = wrap.getBoundingClientRect();
    size = { w: r.width, h: r.height };
    inset = window.innerWidth > 860 ? 392 + 24 : 0;
  }
  function fit() {
    measure();
    var aw = size.w - inset;
    k0 = Math.min(aw / (W * 0.80), size.h / (H * 0.80));
    /* Brooklyn sits in the middle of the drawn area, so center on its middle rather than the whole canvas */
    var c = proj(40.652, -73.945);
    view.k = k0; view.tx = inset + aw / 2 - c[0] * k0; view.ty = size.h / 2 - c[1] * k0;
    apply();
  }

  function zoomAt(f, cx, cy) {

  }

  function flyTo(wx, wy, k, exact) {

  var PIN_PATH = "M0 0C-3-7-16-12-16-24a16 16 0 1 1 32 0C16-12 3-7 0 0Z";
  function renderPins() {
    var list = filtered(), groups = {};
    list.forEach(function (p) { (groups[p.venue] = groups[p.venue] || []).push(p); });
    var selVenue = state.selected ? byId(state.selected).venue : null;
    var keys = Object.keys(groups).sort(function (a, b) { return a === selVenue ? 1 : b === selVenue ? -1 : VENUES[a].lat < VENUES[b].lat ? 1 : -1; });
    var h = "";
    keys.forEach(function (key) {
      var v = VENUES[key], g = groups[key], multi = g.length > 1, anyStar = g.some(function (p) { return starred[p.id]; });
      var cat = multi ? "" : "--cat:var(" + CATS[g[0].cat].v + ")";
      var label = multi ? g.length + " programs at " + v.name : g[0].title + " at " + v.name;
      var glyph = multi ? '<text class="pinnum" y="-19">' + g.length + "</text>" :
        '<g transform="translate(-9.5 -33.5) scale(.8)" fill="none" stroke="var(--on-cat)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">' + ICONS[g[0].cat] + "</g>";
      h += '<g class="pin' + (selVenue === key ? " sel" : "") + '" data-venue="' + key + '" tabindex="0" role="button" aria-label="' + esc(label) + '" style="' + cat + '">' +
        '<path class="pinbody" d="' + PIN_PATH + '"/>' + glyph +
        (anyStar ? '<path class="pinstar" transform="translate(10 -46) scale(.66)" d="M12 2l3 6.3 6.9 1-5 4.8 1.2 6.9L12 17.7 5.9 21l1.2-6.9-5-4.8 6.9-1z"/>' : "") +
        '<text class="pinlabel" x="22" y="-17">' + esc(v.name) + "</text></g>";
    });
    pinsG.innerHTML = h;
    pinEls = [].map.call(pinsG.children, function (el) {
      var v = VENUES[el.getAttribute("data-venue")], p = proj(v.lat, v.lng);
      var key = el.getAttribute("data-venue");
      return { el: el, key: key, n: groups[key].length, x: p[0], y: p[1], sel: el.classList.contains("sel") };
    });
    clSig = null;
    apply();
  }

  function onPin(key) {
    var inList = filtered().filter(function (p) { return p.venue === key; });
    var v = VENUES[key], p = proj(v.lat, v.lng);
    if (inList.length === 1) openProgram(inList[0].id);
    else { state.selected = null; state.view = "browse"; state.venueFocus = key; refresh(); flyTo(p[0], p[1], k0 * 2.4); }
  }

  var ptrs = {}, dragInfo = null, pinchD = 0, suppressClick = false;
  svg.addEventListener("pointerdown", function (e) {
    ptrs[e.pointerId] = { x: e.clientX, y: e.clientY };
    if (Object.keys(ptrs).length === 1) dragInfo = { x: e.clientX, y: e.clientY, moved: false, tx: view.tx, ty: view.ty };
    else { dragInfo = null; pinchD = 0; }
    if (anim) cancelAnimationFrame(anim);
  });
  svg.addEventListener("pointermove", function (e) {
    if (!ptrs[e.pointerId]) return;
    ptrs[e.pointerId] = { x: e.clientX, y: e.clientY };
    var ids = Object.keys(ptrs);
    if (ids.length === 2) {

  });
  function endPtr(e) {

    if (dragInfo && dragInfo.moved) { suppressClick = true; setTimeout(function () { suppressClick = false; }, 0); }
    if (!Object.keys(ptrs).length) { dragInfo = null; svg.classList.remove("dragging"); setTimeout(function () { suppressClick = false; }, 0); }
  }
  svg.addEventListener("pointerup", endPtr); svg.addEventListener("pointercancel", endPtr);
  svg.addEventListener("wheel", function (e) {
    e.preventDefault(); var r = wrap.getBoundingClientRect();
    zoomAt(Math.exp(-e.deltaY * 0.0015), e.clientX - r.left, e.clientY - r.top);
  }, { passive: false });
  svg.addEventListener("click", function (e) {
    if (suppressClick) return;
    var cl = e.target.closest && e.target.closest(".cluster");
    if (cl) { onCluster(cl); return; }
    var pin = e.target.closest && e.target.closest(".pin");
    if (pin) onPin(pin.getAttribute("data-venue"));
  });
  svg.addEventListener("keydown", function (e) {
    var cl = e.target.closest && e.target.closest(".cluster");
    if (cl && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); onCluster(cl); return; }
    if (cl) return;
    var pin = e.target.closest && e.target.closest(".pin");
    if (pin && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); onPin(pin.getAttribute("data-venue")); return; }
    if (pin) return;
    var step = 60, handled = true;
    if (e.key === "ArrowLeft") view.tx += step; else if (e.key === "ArrowRight") view.tx -= step;
    else if (e.key === "ArrowUp") view.ty += step; else if (e.key === "ArrowDown") view.ty -= step;
    else if (e.key === "+" || e.key === "=") { zoomAt(1.3, size.w / 2, size.h / 2); return; }
    else if (e.key === "-" || e.key === "_") { zoomAt(1 / 1.3, size.w / 2, size.h / 2); return; }
    else handled = false;
    if (handled) { e.preventDefault(); touched = true; apply(); }
  });
  $("zin").addEventListener("click", function () { zoomAt(1.5, inset + (size.w - inset) / 2, size.h / 2); });
  $("zout").addEventListener("click", function () { zoomAt(1 / 1.5, inset + (size.w - inset) / 2, size.h / 2); });
  $("zfit").addEventListener("click", function () { touched = false; fit(); });
  if (window.ResizeObserver) new ResizeObserver(function () { if (!touched) fit(); else { measure(); apply(); } }).observe(wrap);

  /* ---------- actions ---------- */
  var toastT;
  function toast(msg) { var t = $("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(function () { t.hidden = true; }, 2600); }
  function refresh() { renderPanel(); renderPins(); updateHeader(); syncChips(); }
  function openProgram(id) {
    var p = byId(id); if (!p) return;
    state.returnTo = state.view === "starred" ? "starred" : "browse";
    state.selected = id; refresh();
    var v = VENUES[p.venue], pr = proj(v.lat, v.lng);
    flyTo(pr[0], pr[1], k0 * 2.6);
  }
  function closeDetail() { state.selected = null; state.view = state.returnTo; refresh(); }
  function toggleStar(id) {
    var p = byId(id); if (!p) return;
    if (starred[id]) { delete starred[id]; toast("Removed from starred"); } else { starred[id] = true; toast("Starred: " + p.title); }
    saveStars(); refresh();
  }
  function copyText(t) {
    function fallback() { var ta = document.createElement("textarea"); ta.value = t; ta.style.position = "fixed"; ta.style.opacity = "0"; document.body.appendChild(ta); ta.select(); var ok = false; try { ok = document.execCommand("copy"); } catch (e) {} document.body.removeChild(ta); toast(ok ? "Address copied" : "Select the address to copy it"); }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(function () { toast("Address copied"); }, fallback); else fallback();
  }

  body.addEventListener("click", function (e) {
    var t = e.target;
    var star = t.closest("[data-star]"); if (star) { e.stopPropagation(); toggleStar(star.getAttribute("data-star")); return; }
    if (t.closest("[data-back]")) { closeDetail(); return; }
    var cp = t.closest("[data-copy]"); if (cp) { copyText(cp.getAttribute("data-copy")); return; }
    if (t.closest("[data-clear-venue]")) { state.venueFocus = null; refresh(); return; }
    if (t.closest("[data-clear-zip]")) { clearZip(); return; }
    if (t.closest("[data-reset]")) { state.q = ""; state.cat = "all"; state.time = "any"; state.venueFocus = null; $("q").value = ""; if (state.zip) { clearZip(); return; } refresh(); return; }
    var vw = t.closest("[data-view]"); if (vw) { state.view = vw.getAttribute("data-view"); refresh(); return; }
    var it = t.closest("[data-open]"); if (it) openProgram(it.getAttribute("data-open"));
  });
  body.addEventListener("keydown", function (e) {
    if ((e.key === "Enter" || e.key === " ") && e.target.matches("[data-open]")) { e.preventDefault(); openProgram(e.target.getAttribute("data-open")); }
  });
  catChips.addEventListener("click", function (e) { var b = e.target.closest("[data-cat]"); if (b) { state.cat = b.getAttribute("data-cat"); state.venueFocus = null; refresh(); } });
  timeChips.addEventListener("click", function (e) { var b = e.target.closest("[data-time]"); if (b) { state.time = b.getAttribute("data-time"); state.venueFocus = null; refresh(); } });
  function zipMsg(t) { var m = $("zipMsg"); m.textContent = t || ""; m.hidden = !t; }
  function clearZip() { state.zip = null; $("zip").value = ""; zipMsg(""); state.venueFocus = null; refresh(); touched = false; fit(); }
  function applyZip(raw) {
    var z = String(raw || "").trim();
    if (!/^\d{5}$/.test(z)) { zipMsg("Enter a 5-digit ZIP code, like 11215."); return false; }
    if (!ZIPS[z]) { zipMsg(z + " isn't a Brooklyn ZIP code this map covers. Try one that starts with 112, like 11215."); return false; }
    state.zip = z; state.selected = null; state.view = "browse"; state.venueFocus = null; state.q = ""; $("q").value = ""; $("zip").value = z;
    refresh(); body.scrollTop = 0;
    var n = filtered().length, c = ZIPS[z], pt = proj(c[0], c[1]);
    zipMsg(n ? "" : "No free programs are listed in or near " + z + " yet.");
    flyTo(pt[0], pt[1], k0 * 3.4, true);
    return true;
  }
  $("zipForm").addEventListener("submit", function (e) { e.preventDefault(); applyZip($("zip").value); });
  $("zip").addEventListener("input", function (e) { var v = e.target.value.replace(/\D/g, "").slice(0, 5); if (v !== e.target.value) e.target.value = v; if (!v) { if (state.zip) clearZip(); else zipMsg(""); } else if (!state.zip) zipMsg(""); });
  $("q").addEventListener("input", function (e) { if (/^\d{5}$/.test(e.target.value.trim()) && ZIPS[e.target.value.trim()]) { applyZip(e.target.value); return; } state.q = e.target.value; state.venueFocus = null; renderPanel(); renderPins(); });
  $("starNav").addEventListener("click", function () { state.selected = null; state.venueFocus = null; state.view = state.view === "starred" ? "browse" : "starred"; refresh(); });
  function setPop(open) { $("profilePop").hidden = !open; $("profileBtn").setAttribute("aria-expanded", String(open)); }
  $("profileBtn").addEventListener("click", function (e) { e.stopPropagation(); setPop($("profilePop").hidden); });
  document.addEventListener("click", function (e) { if (!$("profilePop").hidden && !e.target.closest("#profilePop")) setPop(false); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") { setPop(false); if (state.selected) closeDetail(); } });
  $("popView").addEventListener("click", function () { setPop(false); state.selected = null; state.view = "starred"; refresh(); });
  document.addEventListener("click", function (e) { var n = e.target.closest("[data-nav]"); if (n && n.getAttribute("data-nav") === "soon") { setPop(false); toast("Not part of this prototype yet"); } });
  $("brandLink").addEventListener("click", function (e) { e.preventDefault(); state.zip = null; $("zip").value = ""; zipMsg(""); state.selected = null; state.view = "browse"; state.venueFocus = null; refresh(); touched = false; fit(); });

  GEO = JSON.parse(GEO);
  buildChips(); drawWorld(); fit(); refresh();
})();
